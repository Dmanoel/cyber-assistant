services:

  ollama:
    image: ollama/ollama:latest
    container_name: cyber-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - cyber-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: cyber-open-webui

    restart: unless-stopped

    depends_on:
      - ollama

    ports:
      - "3000:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    volumes:
      - openwebui_data:/app/backend/data

    networks:
      - cyber-network

volumes:

  ollama_data:

  openwebui_data:

networks:

  cyber-network:
    driver: bridge
